name: Collectiv Food
description: 'Collectiv Food is a next-generation B2B food wholesaler serving professional
  kitchens across the UK and France. Launched in London in 2022, it combines collective
  buying power, consolidated deliveries, and direct sourcing through a shortened, patented
  supply-chain model to supply restaurants, hotels, and caterers with meat, fish, plant-based
  proteins, dairy, produce, dry and frozen goods, and prepared items. The company emphasizes
  traceability, responsible sourcing, and sustainability, and is B-Corp certified with an
  EcoVadis Gold rating. It was surfaced as a portfolio company of Partech and added to the
  API Evangelist network for enrichment; no public API or developer portal is currently published.'
